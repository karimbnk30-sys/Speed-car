name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_MINOR: "4.7"

jobs:
  export-android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project folder
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          echo "== Repo files =="
          ls -la
          PROJECT_FILE=$(find . -name project.godot -not -path "./.git/*" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            ZIP_FILE=$(ls -1 *.zip 2>/dev/null | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "No project.godot found; extracting $ZIP_FILE"
              mkdir -p project_src
              unzip -q -o "$ZIP_FILE" -d project_src
              PROJECT_FILE=$(find project_src -name project.godot | head -n 1)
            fi
          fi
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found in repo"; exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          APP_VERSION=$(grep -m1 '^config/version=' "$PROJECT_DIR/project.godot" | cut -d'"' -f2)
          echo "APP_VERSION=${APP_VERSION:-0}" >> "$GITHUB_ENV"
          echo "Project folder: $PROJECT_DIR"
          if [ ! -f "$PROJECT_DIR/export_presets.cfg" ]; then
            echo "ERROR: export_presets.cfg missing in $PROJECT_DIR (upload it to the repo)"; exit 1
          fi
          chmod -R u+rwX "$PROJECT_DIR"

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/

      - name: Android setup (debug keystore + editor settings)
        run: |
          if [ ! -f /root/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
              -keystore /root/debug.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          mkdir -p ~/.config/godot
          JAVA_DIR=$(dirname $(dirname $(readlink -f $(which javac))))
          SDK_DIR=${ANDROID_HOME:-/usr/lib/android-sdk}
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/java_sdk_path = \"${JAVA_DIR}\"" \
            "export/android/android_sdk_path = \"${SDK_DIR}\"" \
            'export/android/debug_keystore = "/root/debug.keystore"' \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > ~/.config/godot/editor_settings-${GODOT_MINOR}.tres
          cat ~/.config/godot/editor_settings-${GODOT_MINOR}.tres

      - name: Import project resources
        run: godot --headless --path "$PROJECT_DIR" --import || true

      - name: Export debug APK
        run: |
          mkdir -p "$PROJECT_DIR/build"
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" build/NeonRacer.apk
          cp "$PROJECT_DIR/build/NeonRacer.apk" "$PROJECT_DIR/build/NeonRacer-v${APP_VERSION}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonRacer-v${{ env.APP_VERSION }}-apk
          path: ${{ env.PROJECT_DIR }}/build/NeonRacer-v${{ env.APP_VERSION }}.apk
          retention-days: 30
