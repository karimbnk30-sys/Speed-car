name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
  GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

jobs:
  build-apk:
    name: Export APK
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Godot project (any folder)
        run: |
          chmod -R a+rwX "$GITHUB_WORKSPACE" || true
          echo "== repo files =="
          find . -maxdepth 3 -not -path './.git/*' | head -50
          P="$(find . -name project.godot -not -path './.git/*' | head -1)"
          if [ -z "$P" ]; then
            Z="$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -1)"
            if [ -n "$Z" ]; then
              echo "No project.godot found; extracting $Z"
              mkdir -p "$GITHUB_WORKSPACE/_project"
              unzip -q -o "$Z" -d "$GITHUB_WORKSPACE/_project"
              P="$(find "$GITHUB_WORKSPACE/_project" -name project.godot | head -1)"
            fi
          fi
          if [ -z "$P" ]; then
            echo "ERROR: project.godot not found anywhere in the repo. Upload the project files."
            exit 1
          fi
          DIR="$(cd "$(dirname "$P")" && pwd)"
          echo "Project dir: $DIR"
          test -f "$DIR/export_presets.cfg" || { echo "ERROR: export_presets.cfg missing next to project.godot"; exit 1; }
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Install export templates
        run: |
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$T"
          SRC=/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ -d "$SRC" ]; then cp -r "$SRC"/. "$T"/; fi
          echo "== templates in image =="; ls "$T" | head -40
          if [ ! -f "$T/android_debug.apk" ]; then
            echo "android_debug.apk missing -> downloading official export templates"
            URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            wget -q "$URL" -O /tmp/templates.tpz
            mkdir -p /tmp/tpl
            unzip -q -o /tmp/templates.tpz -d /tmp/tpl || python3 -m zipfile -e /tmp/templates.tpz /tmp/tpl
            cp -r /tmp/tpl/templates/. "$T"/
          fi
          ls -la "$T/android_debug.apk" "$T/android_release.apk"

      - name: Create debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$GITHUB_WORKSPACE/debug.keystore" >> "$GITHUB_ENV"

      - name: Generate editor settings and import project
        run: |
          cd "$PROJECT_DIR"
          godot --headless --verbose --editor --quit || true
          ls -la .godot || true

      - name: Configure Android SDK / JDK
        run: |
          JAVA_PATH="$(dirname "$(dirname "$(readlink -f "$(which java)")")")"
          SDK_PATH="${ANDROID_HOME:-/usr/lib/android-sdk}"
          echo "JAVA_HOME=$JAVA_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          SETTINGS="$(ls ~/.config/godot/editor_settings-4*.tres 2>/dev/null | head -1)"
          if [ -z "$SETTINGS" ]; then
            SETTINGS=~/.config/godot/editor_settings-4.3.tres
            mkdir -p ~/.config/godot
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SETTINGS"
          fi
          {
            echo "export/android/java_sdk_path = \"$JAVA_PATH\""
            echo "export/android/android_sdk_path = \"$SDK_PATH\""
          } >> "$SETTINGS"
          echo "JAVA=$JAVA_PATH SDK=$SDK_PATH"
          ls "$SDK_PATH" || true

      - name: Export APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          cd "$PROJECT_DIR"
          godot --headless --verbose --export-debug "Android" "$GITHUB_WORKSPACE/build/NeonRacer.apk"
          ls -lh "$GITHUB_WORKSPACE/build"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonRacer-apk
          path: build/NeonRacer.apk
          if-no-files-found: error

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/NeonRacer.apk
