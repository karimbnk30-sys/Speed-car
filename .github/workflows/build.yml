name: DZ VELOCITY - Android Build

# Debug APK on every push / pull request (installable right away, signed with the debug key).
# Signed release APK + AAB when you push a tag like v1.0.0 (or run the workflow by hand with "release" ticked)
# and the keystore secrets below exist.
#
# Optional repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of your release .keystore   (base64 -w0 release.keystore)
#   ANDROID_KEYSTORE_USER     key alias
#   ANDROID_KEYSTORE_PASSWORD keystore / key password

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Also build the signed release APK + AAB (needs the keystore secrets)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  GODOT_MINOR: "4.7"
  GAME_NAME: "DZVelocity"
  EXPECTED_LABEL: "DZ VELOCITY"

jobs:
  # ------------------------------------------------------------------ script parse check (informational)
  lint:
    runs-on: ubuntu-22.04
    continue-on-error: true
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --path . --import || true
      - name: Parse every GDScript file
        run: |
          fail=0
          for f in scripts/*.gd; do
            out=$(godot --headless --path . --check-only --script "res://$f" 2>&1) || { echo "::error file=$f::parse failed"; echo "$out"; fail=1; }
          done
          exit $fail

  # ------------------------------------------------------------------ debug APK
  android-debug:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Project info
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          test -f project.godot || { echo "ERROR: project.godot must be at the repository root"; exit 1; }
          test -f export_presets.cfg || { echo "ERROR: export_presets.cfg missing"; exit 1; }
          test -f icon.png || { echo "ERROR: icon.png missing"; exit 1; }
          APP_VERSION=$(grep -m1 '^config/version=' project.godot | cut -d'"' -f2)
          echo "APP_VERSION=${APP_VERSION:-0}" >> "$GITHUB_ENV"
          echo "Building DZ VELOCITY v${APP_VERSION}"

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/

      - name: Android setup (debug keystore + editor settings)
        run: |
          if [ ! -f /root/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
              -keystore /root/debug.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          mkdir -p ~/.config/godot
          JAVA_DIR=$(dirname $(dirname $(readlink -f $(which javac))))
          SDK_DIR=${ANDROID_HOME:-/usr/lib/android-sdk}
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/java_sdk_path = \"${JAVA_DIR}\"" \
            "export/android/android_sdk_path = \"${SDK_DIR}\"" \
            'export/android/debug_keystore = "/root/debug.keystore"' \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > ~/.config/godot/editor_settings-${GODOT_MINOR}.tres

      - name: Import project resources
        run: godot --headless --path . --import || true

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/${GAME_NAME}.apk
          cp build/${GAME_NAME}.apk build/${GAME_NAME}-v${APP_VERSION}-debug.apk
          ls -la build

      - name: Verify app name + icon inside the APK
        run: |
          AAPT=$(ls "${ANDROID_HOME:-/usr/lib/android-sdk}"/build-tools/*/aapt2 2>/dev/null | tail -n1)
          [ -z "$AAPT" ] && AAPT=$(ls "${ANDROID_HOME:-/usr/lib/android-sdk}"/build-tools/*/aapt 2>/dev/null | tail -n1)
          if [ -z "$AAPT" ]; then echo "aapt not found - skipping badging check"; exit 0; fi
          "$AAPT" dump badging build/${GAME_NAME}.apk > badging.txt 2>&1 || true
          grep -E "^package:|application-label:|application-icon" badging.txt || true
          grep -q "application-label:'${EXPECTED_LABEL}'" badging.txt || { echo "::error::Android app label is not '${EXPECTED_LABEL}'"; exit 1; }
          unzip -l build/${GAME_NAME}.apk | grep -E "mipmap|icon" || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DZVelocity-v${{ env.APP_VERSION }}-debug-apk
          path: build/${{ env.GAME_NAME }}-v${{ env.APP_VERSION }}-debug.apk
          retention-days: 30

  # ------------------------------------------------------------------ signed release APK + AAB
  android-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: android-debug
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.7.2
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
      GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        id: ks
        run: |
          if [ -z "$KS_B64" ] || [ -z "$GODOT_ANDROID_KEYSTORE_RELEASE_USER" ] || [ -z "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" ]; then
            echo "::warning::Release keystore secrets are not set - skipping signed release build (the debug APK is still available)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KS_B64" | base64 -d > /root/release.keystore
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/root/release.keystore" >> "$GITHUB_ENV"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Godot + Android
        if: steps.ks.outputs.ok == 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          APP_VERSION=$(grep -m1 '^config/version=' project.godot | cut -d'"' -f2)
          echo "APP_VERSION=${APP_VERSION:-0}" >> "$GITHUB_ENV"
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          if [ ! -f /root/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
              -keystore /root/debug.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          mkdir -p ~/.config/godot
          JAVA_DIR=$(dirname $(dirname $(readlink -f $(which javac))))
          SDK_DIR=${ANDROID_HOME:-/usr/lib/android-sdk}
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/java_sdk_path = \"${JAVA_DIR}\"" \
            "export/android/android_sdk_path = \"${SDK_DIR}\"" \
            'export/android/debug_keystore = "/root/debug.keystore"' \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > ~/.config/godot/editor_settings-${GODOT_MINOR}.tres
          godot --headless --path . --import || true

      - name: Export signed release APK
        if: steps.ks.outputs.ok == 'true'
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android Release" build/${GAME_NAME}-release.apk
          cp build/${GAME_NAME}-release.apk build/${GAME_NAME}-v${APP_VERSION}.apk

      - name: Export signed AAB (Gradle build, experimental)
        if: steps.ks.outputs.ok == 'true'
        continue-on-error: true
        run: |
          # same as the editor's "Project > Install Android Build Template"
          mkdir -p android/build
          unzip -q -o ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore
          godot --headless --path . --export-release "Android AAB" build/${GAME_NAME}-v${APP_VERSION}.aab

      - name: Upload release files
        if: steps.ks.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DZVelocity-v${{ env.APP_VERSION }}-release
          path: |
            build/${{ env.GAME_NAME }}-v${{ env.APP_VERSION }}.apk
            build/${{ env.GAME_NAME }}-v${{ env.APP_VERSION }}.aab
          if-no-files-found: warn
          retention-days: 90

      - name: Publish GitHub Release (tags only)
        if: steps.ks.outputs.ok == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DZ VELOCITY ${{ github.ref_name }}
          files: |
            build/${{ env.GAME_NAME }}-v${{ env.APP_VERSION }}.apk
            build/${{ env.GAME_NAME }}-v${{ env.APP_VERSION }}.aab
